name: ttwr
on:
  workflow_run:
    workflows: ["tt"]
    types: [completed]
permissions: {}
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const c = JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`TRIGGER=workflow_run  head_branch=${context.payload.workflow_run.head_branch}  event=${context.payload.workflow_run.event}`);
            core.info(`  trust_tier = ${c.trust_tier}`);
            core.info(`  ac         = ${c.ac}`);
            core.info(`  scp        = ${c.scp}`);
