name: tt
on:
  push:
  pull_request:
  pull_request_target:
  workflow_dispatch:
  repository_dispatch:
    types: [probe]
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
permissions: {}
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const c = JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`TRIGGER=${context.eventName} REF=${context.ref}`);
            core.info(`  trust_tier = ${c.trust_tier}`);
            core.info(`  ac         = ${c.ac}`);
            core.info(`  acsl       = ${c.acsl}`);
            core.info(`  scp        = ${c.scp}`);
            core.info(`  run_type   = ${c.run_type}  repo_vis=${c.repository_visibility}`);
